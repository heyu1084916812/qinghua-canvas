<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>轻画拖拽收藏</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="brand">
        <img src="icons/32.png" width="26" height="26" alt="" />
        <strong>轻画 Clipper</strong>
      </header>

      <section class="connection" aria-live="polite">
        <span id="status-dot" class="dot" aria-hidden="true"></span>
        <span id="status">正在连接轻画</span>
      </section>

      <label class="control" for="drag-mode">
        <span class="copy">
          <strong>拖拽收藏</strong>
          <span id="hint">开启后，把网页图片拖到页面中间</span>
        </span>
        <input id="drag-mode" type="checkbox" role="switch" aria-label="拖拽收藏" />
        <span class="switch" aria-hidden="true"></span>
      </label>
    </main>
    <script src="shared.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
